# Мир гонок: трасса целиком должна лежать в нём.
world: race

# Кругов по умолчанию, когда /race start вызван без аргумента.
laps: 15
# Отсчёт перед стартом, секунд. До сигнала "СТАРТ" лодки держатся на месте.
countdown-seconds: 10

# Стартовые позиции: [x, y, z] или [x, y, z, yaw]. Стоят перед финишем.
# Позиции раздаются по порядку, одна на игрока: сколько позиций — столько мест
# в заезде, остальные онлайн остаются вне гонки. Лодка появляется на 3 блока
# выше точки и падает на место, иначе её вкапывает в блок. Указывай саму точку,
# без запаса по высоте.
starts:
  - [-3, 63, 48, -90]
  - [-3, 63, 52, -90]
  - [-7, 63, 48, -90]
  - [-7, 63, 52, -90]

# Зона финиша: два угловых блока (входят в зону целиком) и разрешённое
# направление пересечения: +X, -X, +Y, -Y, +Z или -Z. Пересечение в обратную
# сторону круг не засчитывает.
finish:
  corner1: [0, 62, 46]
  corner2: [0, 70, 54]
  direction: "+X"

# Чекпоинты в порядке движения по трассе. Круг идёт в зачёт только после
# прохождения всех по порядку и последующего пересечения финиша.
checkpoints:
  - corner1: [46, 62, 0]
    corner2: [54, 70, 0]
  - corner1: [0, 62, -54]
    corner2: [0, 70, -46]
  - corner1: [-54, 62, 0]
    corner2: [-46, 70, 0]

